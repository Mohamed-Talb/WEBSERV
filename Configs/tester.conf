server {
    listen 0.0.0.0:8080;
    server_name localhost;

    root ./Www/YoupiBanane;
    client_max_body_size 104857600;

    location / 
    {
        methods GET;
        root ./Www/YoupiBanane/;
        index youpi.bad_extension;
        autoindex off;
    }

    location /post_body 
    {
        methods POST;
        root ./Www/YoupiBanane;
        client_max_body_size 100;
        upload_path .;
        upload on;
        autoindex off;
    }

    location /directory 
    {
        methods GET POST;
        root ./Www/YoupiBanane;
        index youpi.bad_extension;
        cgi_pass .bla ./Testers/cgi_tester;
        client_max_body_size 104857600;
        autoindex off;
    }
}