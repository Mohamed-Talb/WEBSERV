</head>

<body>

  <main class="wrap">
    <p class="eyebrow">05 — CGI test</p>
    <h1 style="text-transform:none;">CGI script runner</h1>
    <p class="lead">Sends GET or POST to a CGI-mapped path (e.g. <code>/cgi-bin/test.py</code>) and prints exactly what
      comes back — good for checking headers, exit status, and env passing.</p>

    <div class="panel" style="margin-top:24px;">
      <div class="field-row">
        <div>
          <label for="cgiPath">CGI path</label>
          <input type="text" id="cgiPath" value="/cgi-bin/test.py">
        </div>
        <div>
          <label for="cgiMethod">Method</label>
          <select id="cgiMethod">
            <option value="GET" selected>GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT — expect 405</option>
            <option value="DELETE">DELETE — expect 405</option>
          </select>
        </div>
      </div>

      <label for="cgiQuery">Query string (GET) — e.g. name=webserv&amp;n=42</label>
      <input type="text" id="cgiQuery" placeholder="name=webserv&n=42">

      <label for="cgiBody">Body (POST)</label>
      <textarea id="cgiBody" placeholder='foo=bar or {"foo":"bar"}'></textarea>

      <label for="cgiContentType">Content-Type (POST)</label>
      <input type="text" id="cgiContentType" value="application/x-www-form-urlencoded">

      <div class="btn-row">
        <button class="btn accent" id="runBtn">Run request</button>
        <button class="btn ghost" id="clearBtn">Clear log</button>
      </div>

      <div class="console" id="log">// CGI output will appear here</div>
    </div>
  </main>

  <script src="Common.js"></script>
  <script>
    const log = document.querySelector("#log");
    document.querySelector("#clearBtn").addEventListener("click", () => { log.textContent = ""; });

    document.querySelector("#runBtn").addEventListener("click", async () => {
      const path = document.querySelector("#cgiPath").value || "/cgi-bin/test.py";
      const method = document.querySelector("#cgiMethod").value;
      const query = document.querySelector("#cgiQuery").value.trim();
      const body = document.querySelector("#cgiBody").value;
      const ctype = document.querySelector("#cgiContentType").value;

      let fullPath = path;
      if (method === "GET" && query) fullPath += "?" + query;
      const url = wsUrl(fullPath);

      const opts = { method };
      if (method === "POST") {
        opts.headers = { "Content-Type": ctype };
        opts.body = body;
      }

      wsLog(log, `${method} ${url}`, "k");
      if (method === "POST") wsLog(log, `Content-Type: ${ctype}\n` + body);

      try {
        const res = await fetch(url, opts);
        const text = await res.text();
        wsLog(log, `\n${res.status} ${res.statusText}`, res.ok ? "ok" : "err");
        res.headers.forEach((v, k) => wsLog(log, `${k}: ${v}`));
        wsLog(log, "\n" + text);
      } catch (e) {
        wsLog(log, "request failed: " + e.message, "err");
      }
    });
  </script>
</body>

</html>
