<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webserv // uploads</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="upload.html">Upload</a>
        <a href="uploads.html">Uploads</a>
        <a href="session.html">Session</a>
        <a href="cgi-test.html">CGI Test</a>
        <a href="diagnostics.html">Diagnostics</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <p class="eyebrow">03 — Uploads</p>
    <h1 style="text-transform:none;">Stored files</h1>
    <p class="lead">Fetches the HTML autoindex returned by this WebServ upload directory. Open or delete stored files
      directly from the list.</p>

    <div class="panel" style="margin-top:24px;">
      <label for="listPath">Listing endpoint</label>
      <input type="text" id="listPath" value="/upload/">

      <div class="btn-row">
        <button class="btn accent" id="refreshBtn">Refresh list</button>
        <button class="btn ghost" id="clearLog">Clear log</button>
      </div>

      <ul class="file-list" id="fileList" style="margin-top:18px;">
        <li><span class="fname">no data loaded yet</span><span class="fmeta">click refresh</span></li>
      </ul>

      <div class="console" id="log" style="display:none;"></div>
    </div>
  </main>

  <script src="Common.js"></script>
  <script>
    const listEl = document.querySelector("#fileList");
    const log = document.querySelector("#log");
    const refreshBtn = document.querySelector("#refreshBtn");

    const clearBtn = document.querySelector("#clearLog");

    clearBtn.addEventListener("click", () => { log.textContent = ""; });

    function renderEmpty(msg) {
      listEl.innerHTML = `<li><span class="fname">${wsEscape(msg)}</span></li>`;
    }

    function renderFromNames(names) {
      if (!names.length) return renderEmpty("directory is empty");
      const listPath = document.querySelector("#listPath").value.replace(/\/+$/, "");

      function fileUrl(name) {
        // Autoindex links are already absolute (e.g. /upload/TEST.TXT),
        // while JSON listings normally return just the filename.
        if (String(name).startsWith("/")) return wsUrl(String(name));
        return wsUrl(listPath + "/" + name);
      }

      listEl.innerHTML = names.map((n, index) =>
        `<li><span class="fname">${wsEscape(n)}</span><span><a class="fmeta" href="${wsEscape(fileUrl(n))}" target="_blank">open ↗</a> <button class="file-delete" data-index="${index}">delete</button></span></li>`
      ).join("");

      listEl.querySelectorAll(".file-delete").forEach((button) => {
        button.addEventListener("click", async () => {
          const name = names[Number(button.dataset.index)];
          if (!confirm(`Delete ${name}?`)) return;
          const res = await fetch(fileUrl(name), { method: "DELETE" });
          wsLog(log, `DELETE ${fileUrl(name)} → ${res.status} ${res.statusText}`, res.ok ? "ok" : "err");
          if (res.ok) refreshBtn.click();
        });
      });
    }

    function parseHtmlIndex(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      return Array.from(doc.querySelectorAll("a"))
        .map((a) => a.getAttribute("href"))
        .filter((h) => h && h !== "../" && h !== "/")
        .map((h) => decodeURIComponent(h.replace(/\/$/, "")));
    }

    refreshBtn.addEventListener("click", async () => {
      const path = document.querySelector("#listPath").value || "/uploads/";
      const url = wsUrl(path);

      log.style.display = "block";
      log.textContent = "";
      wsLog(log, `GET ${url}`, "k");
      refreshBtn.disabled = true;

      try {
        const res = await fetch(url, { cache: "no-store" });
        const text = await res.text();
        wsLog(log, `${res.status} ${res.statusText}`, res.ok ? "ok" : "err");

        if (!res.ok) {
          renderEmpty(`server returned ${res.status}`);
          return;
        }

        renderFromNames(parseHtmlIndex(text));
      } catch (e) {
        wsLog(log, "request failed: " + e.message, "err");
        renderEmpty("could not reach server");
      } finally {
        refreshBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
