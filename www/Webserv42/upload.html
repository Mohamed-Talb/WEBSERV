<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webserv // upload</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <nav class="nav">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="basic-tests.html">BASIC TESTS</a>
        <a href="upload.html">UPLOAD</a>

        <a href="cgi-test.html">CGI TEST</a>
        <a href="session.html">SESSION</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <p class="eyebrow">03 — Upload</p>
    <h1 style="text-transform:none;">File upload</h1>
    <p class="lead">Sends a real <code>multipart/form-data</code> POST to your server and shows the raw response,
      headers included.</p>

    <div class="panel" style="margin-top:24px;">

      <div class="field-row">
        <div>
          <label for="uploadPath">Upload endpoint</label>
          <input type="text" id="uploadPath" value="/upload">
        </div>
        <div>
          <label for="fieldName">Form field name</label>
          <input type="text" id="fieldName" value="file">
        </div>
      </div>

      <label for="fileInput">Choose a file</label>
      <input type="file" id="fileInput">

      <div class="btn-row">
        <button class="btn accent" id="sendUpload">Send upload</button>
        <button class="btn ghost" id="clearLog">Clear log</button>
      </div>

      <div class="console" id="log"></div>
    </div>
  </main>

  <script src="Common.js"></script>
  <script>
    const fileInput = document.querySelector("#fileInput");
    const log = document.querySelector("#log");
    const sendBtn = document.querySelector("#sendUpload");
    const clearBtn = document.querySelector("#clearLog");

    clearBtn.addEventListener("click", () => { log.textContent = ""; });

    sendBtn.addEventListener("click", async () => {
      log.textContent = "";

      const file = fileInput.files[0];
      const path = document.querySelector("#uploadPath").value || "/upload";
      const field = document.querySelector("#fieldName").value || "file";

      if (!file) {
        wsLog(log, "no file selected", "err");
        return;
      }

      const fd = new FormData();
      fd.append(field, file, file.name);

      wsLog(log, "Request:", "type");

      const url = wsUrl(path);
      wsLog(log, `POST ${url}  (${file.name}, ${file.size} bytes, ${file.type || "unknown type"})`, "k");

      for (let i = 0; i < 2; i++) {
        const new_line = document.createElement("br");
        log.appendChild(new_line);
      }

      wsLog(log, "Response:", "type");
      sendBtn.disabled = true;
      sendBtn.textContent = "SENDING…";

      try {
        const res = await fetch(url, { method: "POST", body: fd });
        const text = await res.text();
        wsLog(log, `${res.status} ${res.statusText}`, res.ok ? "ok" : "err");
        res.headers.forEach((v, k) => wsLog(log, `${k}: ${v}`));
        if (text) wsLog(log, "\n" + text);
      } catch (e) {
        wsLog(log, "request failed: " + e.message, "err");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send upload";
      }
    });
  </script>
</body>

</html>
