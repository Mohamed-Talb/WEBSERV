server {
    listen 0.0.0.0:8080;
    server_name localhost;

    root ./YoupiBanane;
    client_max_body_size 104857600;

    location / {
        methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
        autoindex off;
    }

    location /post_body {
        methods POST;
        root ./YoupiBanane;
        client_max_body_size 100;
        upload_path ./YoupiBanane;
        upload on;
        autoindex off;
    }

    location /directory {
        methods GET POST;
        root ./YoupiBanane;
        index youpi.bad_extension;
        cgi_ext .bla;
        cgi_path ./cgi_test;
        client_max_body_size 104857600;
        autoindex off;
    }
}