server 
{
    listen 8080;
    server_name localhost;

    root ./www/Webserv42;
    index index.html;
    client_max_body_size 10000000;

    location / 
    {
        methods GET;
        root ./www/Webserv42;
        index index.html;
        autoindex off;
    }

    location /upload 
    {
        methods GET POST DELETE;
        root ./www/Webserv42;
        upload on;
        upload_path upload;
        client_max_body_size 10000000;
        autoindex on;
    }

    location /cgi_bin 
    {
        methods GET POST;
        root ./www/Webserv42;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
        client_max_body_size 10000000;
        autoindex off;
    }
}