# Run with: ./WebServ configs/portfolio.conf
#
# The portfolio is served from /portfolio/. Its controls test the upload and
# CGI routes below, so the whole demo can be used with one server process.
server {
    listen 0.0.0.0:8080;
    server_name localhost;

    root ./www;
    index portfolio/index.html;
    client_max_body_size 1GB;

    error_page 404 /404.html;
    error_page 500 502 503 /500.html;

    location /portfolio {
        methods GET;
        root ./www/portfolio;
        index index.html;
    }

    location /upload {
        methods GET POST DELETE;
        root ./www/upload;
        autoindex on;
        upload on;
        upload_path ./www/upload;
    }

    location /cgi-bin {
        methods GET POST;
        root ./www/cgi_bin;
        cgi_path /usr/bin/python3;
        cgi_ext .py;
    }
}
